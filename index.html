<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأستاذ - إعدادية النهرين المهنية</title>
    <style>
        @import url('https://googleapis.com');

        :root {
            --bg-dark: #0a192f; 
            --cyan-bright: #00f2ff; 
            --purple-bright: #d8b4fe; 
            --card-bg: rgba(23, 42, 69, 0.8); 
            --border: #1e3a5f;
            --text-main: #e6f1ff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0; padding: 20px;
            background-image: radial-gradient(circle at top right, #112240 0%, #0a192f 100%);
        }

        .school-header {
            display: flex;
            justify-content: flex-start;
            padding: 15px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .school-name {
            color: var(--cyan-bright);
            font-weight: bold;
            font-size: 1.2rem;
            border-left: 4px solid var(--purple-bright);
            padding-left: 15px;
        }

        .container { max-width: 900px; margin: auto; }

        header { text-align: center; margin-bottom: 50px; }
        
        .main-title {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(to left, var(--cyan-bright), var(--purple-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        .exam-setup {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 25px;
            display: flex; gap: 20px;
            margin-bottom: 40px;
        }

        .input-group { flex: 1; }
        label { display: block; color: var(--purple-bright); font-size: 0.9rem; margin-bottom: 8px; font-weight: bold; }
        
        input, select {
            width: 100%;
            background: #0d1e35;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            color: white;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        input:focus { border-color: var(--cyan-bright); outline: none; }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        .q-badge {
            background: rgba(0, 242, 255, 0.1);
            color: var(--cyan-bright);
            padding: 6px 18px;
            border-radius: 8px;
            border: 1px solid var(--cyan-bright);
            font-weight: bold;
        }

        .btn-delete {
            background: rgba(255, 71, 87, 0.1);
            color: #ff4757;
            border: 1px solid #ff4757;
            padding: 6px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            margin: 20px 0;
        }

        .opt-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--border);
            padding: 12px;
            border-radius: 12px;
        }

        .actions {
            display: flex; gap: 20px;
            margin-top: 40px;
            padding: 25px; 
            border-radius: 18px;
            background: rgba(23, 42, 69, 0.6);
            border: 1px solid var(--border);
        }

        .btn {
            flex: 1; padding: 16px; border-radius: 12px;
            cursor: pointer; font-weight: bold; font-size: 1.1rem;
            transition: 0.3s; border: none;
            font-family: 'Cairo', sans-serif;
        }

        .btn-add { background: #1e3a5f; color: var(--cyan-bright); border: 1px solid var(--cyan-bright); }
        .btn-save { background: linear-gradient(45deg, #00d2ff, #9d50bb); color: white; }

        .results-link {
            display: block; text-align: center; margin-top: 30px;
            padding: 18px; border: 1px solid var(--border);
            border-radius: 15px; color: var(--cyan-bright);
            text-decoration: none; font-weight: bold;
            background: rgba(0, 242, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="school-header">
        <div class="school-name">| إعدادية النهرين المهنية</div>
    </div>

    <div class="container">
        <header>
            <div style="font-size: 50px;">💎</div>
            <h1 class="main-title">لوحة تحكم الأستاذ</h1>
            <p style="color: var(--purple-bright); font-weight: bold;">إدارة الامتحانات الرقمية المتطورة</p>
        </header>

        <div class="exam-setup">
            <div class="input-group">
                <label>🏷️ اسم الاختبار</label>
                <input type="text" id="examTitle" placeholder="مثال: أساسيات الحاسوب">
            </div>
            <div class="input-group" style="max-width: 150px;">
                <label>⏱️ الوقت (دقيقة)</label>
                <input type="number" id="duration" value="30">
            </div>
        </div>

        <div id="questionsContainer"></div>

        <div class="actions">
            <button class="btn btn-add" onclick="addNewQuestion()">➕ إضافة سؤال جديد</button>
            <button class="btn btn-save" onclick="alert('تم حفظ الاختبار بنجاح!')">🚀 نشر الاختبار الآن</button>
        </div>

        <a href="results.html" class="results-link">📊 الانتقال إلى سجل نتائج الطلاب</a>
    </div>

<script>
    let qCounter = 0;

    function addNewQuestion() {
        qCounter++;
        const id = `q_${Date.now()}`;
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = id;

        card.innerHTML = `
            <div class="q-header">
                <span class="q-badge">سؤال رقم #${qCounter}</span>
                <button class="btn-delete" onclick="document.getElementById('${id}').remove(); reIndex();">حذف</button>
            </div>

            <div style="margin-bottom: 20px; display:flex; align-items:center; gap:15px;">
                <label style="margin:0;">عدد الخيارات:</label>
                <select onchange="updateOptions('${id}', this.value)" style="width: auto; background:#0d1e35;">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4" selected>4</option>
                </select>
            </div>

            <input type="text" placeholder="اكتب نص السؤال هنا..." style="font-size: 1.1rem; border-bottom: 2px solid var(--purple-bright); border-radius:0; background:transparent; padding:10px 0;">
            
            <div class="options-grid" id="grid_${id}"></div>

            <div style="margin-top: 25px; background: rgba(0, 242, 255, 0.05); padding: 20px; border-radius: 12px; border: 1px solid rgba(0, 242, 255, 0.1);">
                <label>🎯 الإجابة الصحيحة:</label>
                <select id="correct_${id}" style="border-color: var(--cyan-bright); margin-top:10px;"></select>
            </div>
        `;

        document.getElementById('questionsContainer').appendChild(card);
        updateOptions(id, 4);
        reIndex();
    }

    function updateOptions(qId, num) {
        const grid = document.getElementById(`grid_${qId}`);
        const select = document.getElementById(`correct_${qId}`);
        grid.innerHTML = '';
        select.innerHTML = '<option disabled selected>اختر الحل الصحيح...</option>';

        for (let i = 1; i <= num; i++) {
            grid.innerHTML += `<div class="opt-item"><input type="text" placeholder="الخيار ${i}" style="border:none; background:transparent; width:100%; color:white; outline:none;"></div>`;
            select.innerHTML += `<option value="${i-1}">الخيار (${i})</option>`;
        }
    }

    function reIndex() {
        const badges = document.querySelectorAll('.q-badge');
        badges.forEach((b, i) => b.innerText = `سؤال رقم #${i + 1}`);
    }

    window.onload = addNewQuestion;
</script>

</body>
</html>
