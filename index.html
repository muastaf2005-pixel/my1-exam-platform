<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأستاذ - إدارة الامتحانات</title>
    <style>
        :root { --primary: #1a73e8; --secondary: #34a853; --bg: #f8f9fa; --text: #202124; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        header { text-align: center; border-bottom: 2px solid #eee; margin-bottom: 30px; padding-bottom: 10px; }
        h1 { color: var(--primary); margin: 0; font-size: 28px; }
        
        .exam-info { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; background: #f1f3f4; padding: 20px; border-radius: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #5f6368; }
        input[type="text"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 16px; }

        .question-card { background: #fff; border: 2px solid #e8eaed; padding: 20px; border-radius: 12px; margin-bottom: 20px; position: relative; transition: 0.3s; }
        .question-card:hover { border-color: var(--primary); }
        .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .q-number { background: var(--primary); color: white; padding: 5px 15px; border-radius: 20px; font-size: 14px; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .option-item { background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px dashed #ccc; }
        
        .correct-select { width: 100%; margin-top: 15px; padding: 10px; border-radius: 8px; border: 1px solid var(--secondary); color: var(--secondary); font-weight: bold; cursor: pointer; }

        .actions { display: flex; gap: 15px; margin-top: 30px; }
        button { border: none; padding: 15px 25px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-add { background: #e8f0fe; color: var(--primary); flex: 1; border: 1px solid var(--primary); }
        .btn-add:hover { background: var(--primary); color: white; }
        .btn-save { background: var(--secondary); color: white; flex: 2; box-shadow: 0 4px 10px rgba(52, 168, 83, 0.3); }
        .btn-save:hover { background: #2d8a46; transform: translateY(-2px); }
        
        .results-link { display: block; text-align: center; margin-top: 25px; color: var(--primary); text-decoration: none; font-weight: bold; border: 1px solid var(--primary); padding: 10px; border-radius: 8px; }
        .results-link:hover { background: #f1f3f4; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>👨‍🏫 لوحة إعداد الامتحانات</h1>
            <p>قم ببناء امتحانك وتحديد الإجابات الصحيحة بسهولة</p>
        </header>

        <!-- معلومات الامتحان العامة -->
        <div class="exam-info">
            <div>
                <label>عنوان الامتحان</label>
                <input type="text" id="examTitle" placeholder="مثال: اختبار الشهر الأول في الرياضيات">
            </div>
            <div>
                <label>المدة (بالدقائق)</label>
                <input type="number" id="duration" value="30">
            </div>
        </div>

        <!-- قائمة الأسئلة -->
        <div id="questionsList">
            <!-- سيتم إضافة الأسئلة هنا ديناميكياً -->
        </div>

        <div class="actions">
            <button class="btn-add" onclick="addNewQuestion()">➕ إضافة سؤال جديد</button>
            <button class="btn-save" onclick="publishExam()">🚀 حفظ ونشر الامتحان</button>
        </div>

        <a href="results.html" class="results-link">📊 عرض سجل نتائج الطلاب والبحث عنهم</a>
    </div>

    <script>
        let qCount = 0;

        function addNewQuestion() {
            qCount++;
            const qDiv = document.createElement('div');
            qDiv.className = 'question-card';
            qDiv.innerHTML = `
                <div class="question-header">
                    <span class="q-number">سؤال رقم ${qCount}</span>
                    <button onclick="this.parentElement.parentElement.remove()" style="background:none; color:red; cursor:pointer; font-size:20px;">🗑️</button>
                </div>
                <input type="text" class="q-text" placeholder="اكتب نص السؤال هنا...">
                
                <div class="options-grid">
                    <div class="option-item">
                        <label>الخيار (1)</label>
                        <input type="text" class="opt" placeholder="الإجابة الأولى">
                    </div>
                    <div class="option-item">
                        <label>الخيار (2)</label>
                        <input type="text" class="opt" placeholder="الإجابة الثانية">
                    </div>
                </div>

                <select class="correct-select">
                    <option value="" disabled selected>حدد الإجابة الصحيحة للسؤال...</option>
                    <option value="0">الخيار (1) هو الإجابة الصحيحة</option>
                    <option value="1">الخيار (2) هو الإجابة الصحيحة</option>
                </select>
            `;
            document.getElementById('questionsList').appendChild(qDiv);
            qDiv.scrollIntoView({ behavior: 'smooth' });
        }

        async function publishExam() {
            const title = document.getElementById('examTitle').value;
            const duration = document.getElementById('duration').value;
            const qCards = document.querySelectorAll('.question-card');

            if (!title || qCards.length === 0) {
                return alert("يرجى إدخال عنوان الامتحان وإضافة سؤال واحد على الأقل!");
            }

            const questions = Array.from(qCards).map(card => ({
                text: card.querySelector('.q-text').value,
                options: Array.from(card.querySelectorAll('.opt')).map(o => o.value),
                correct: parseInt(card.querySelector('.correct-select').value)
            }));

            // التحقق من ملء جميع البيانات
            if (questions.some(q => !q.text || q.options.some(o => !o) || isNaN(q.correct))) {
                return alert("يرجى التأكد من ملء جميع الأسئلة وخياراتها وتحديد الإجابة الصحيحة لكل سؤال!");
            }

            const examData = { title, duration, questions };

            try {
                const response = await fetch('/api/save-exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(examData)
                });

                if (response.ok) {
                    alert("✅ تم حفظ الامتحان ونشره بنجاح! يمكن للطلاب البدء الآن.");
                }
            } catch (error) {
                alert("❌ حدث خطأ أثناء الحفظ، تأكد من تشغيل السيرفر.");
            }
        }

        // إضافة سؤال أول تلقائياً عند فتح الصفحة
        addNewQuestion();
    </script>
</body>
</html>
