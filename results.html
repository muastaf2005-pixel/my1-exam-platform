<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سجل نتائج الطلاب - إعدادية النهرين المهنية</title>
    <style>
        @import url('https://googleapis.com');

        :root {
            --bg-dark: #0a192f; /* كحلي أفتح وأرقى */
            --cyan-bright: #00f2ff;
            --purple-bright: #d8b4fe;
            --card-bg: rgba(23, 42, 69, 0.8);
            --border: #1e3a5f;
            --text-white: #e6f1ff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            margin: 0; padding: 20px;
            background-image: radial-gradient(circle at top right, #112240 0%, #0a192f 100%);
        }

        /* رأس الصفحة - اسم المدرسة */
        .school-header {
            display: flex; justify-content: flex-start;
            padding: 15px; border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        .school-name {
            color: var(--cyan-bright); font-weight: bold; font-size: 1.2rem;
            border-left: 4px solid var(--purple-bright); padding-left: 15px;
        }

        .container { max-width: 1000px; margin: auto; }

        h1 {
            text-align: center; font-weight: 900; font-size: 2.2rem;
            background: linear-gradient(to left, var(--cyan-bright), var(--purple-bright));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }

        /* أدوات التحكم والبحث */
        .controls {
            display: flex; gap: 20px; margin-bottom: 30px; align-items: center;
        }

        .search-box { flex: 1; position: relative; }
        .search-box input {
            width: 100%; padding: 15px 45px 15px 15px;
            background: var(--card-bg); border: 2px solid var(--border);
            border-radius: 12px; color: white; font-size: 16px; outline: none;
            transition: 0.3s; box-sizing: border-box;
        }
        .search-box input:focus { border-color: var(--cyan-bright); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        .search-box::after { content: '🔍'; position: absolute; right: 15px; top: 15px; font-size: 20px; }

        .btn-print {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white; border: none; padding: 15px 30px;
            border-radius: 12px; cursor: pointer; font-weight: bold;
            transition: 0.3s; display: flex; align-items: center; gap: 10px;
        }
        .btn-print:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 210, 255, 0.4); }

        /* تنسيق الجدول */
        .table-container {
            background: var(--card-bg); border-radius: 20px;
            padding: 20px; border: 1px solid var(--border);
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            color: var(--purple-bright); padding: 20px; text-align: right;
            font-size: 15px; text-transform: uppercase; border-bottom: 2px solid var(--border);
        }
        td { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        tr:hover td { background: rgba(0, 242, 255, 0.05); color: var(--cyan-bright); }

        /* الأوسمة (ناجح/راسب) */
        .badge {
            padding: 6px 15px; border-radius: 8px; font-size: 13px; font-weight: bold;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .pass { background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid #00ff88; }
        .fail { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid #ff4757; }

        @media print {
            body { background: white; color: black; }
            .controls, .school-header { display: none; }
            .table-container { border: none; padding: 0; }
            th { color: black; border-bottom: 2px solid black; }
            td { color: black; border-bottom: 1px solid #eee; }
        }
    </style>
</head>
<body>

    <div class="school-header">
        <div class="school-name">| إعدادية النهرين المهنية</div>
    </div>

    <div class="container">
        <h1>📊 سجل نتائج الطلاب الرقمي</h1>
        
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" onkeyup="filterResults()" placeholder="ابحث عن اسم الطالب لفلترة النتائج...">
            </div>
            <button class="btn-print" onclick="window.print()">🖨️ طباعة التقرير</button>
        </div>

        <div class="table-container">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>اسم الطالب الثلاثي</th>
                        <th>الدرجة المحققة</th>
                        <th>التاريخ والوقت</th>
                        <th>النتيجة النهائية</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- البيانات تظهر هنا -->
                </tbody>
            </table>
            <div id="noResult" style="display:none; text-align:center; padding:40px; color:var(--purple-bright);">
                ❌ لم يتم العثور على أي نتائج مطابقة لعملية البحث.
            </div>
        </div>
    </div>

    <script>
        // بيانات تجريبية (سيتم استبدالها ببيانات السيرفر لديك)
        let allResultsData = [
            { name: "أحمد علي جاسم", score: "18 / 20", date: "2024-05-12 10:30 AM" },
            { name: "مرتضى محمد عزيز", score: "08 / 20", date: "2024-05-12 11:15 AM" }
        ];

        async function fetchResults() {
            try {
                const res = await fetch('/api/get-all-results');
                if (res.ok) {
                    allResultsData = await res.json();
                }
            } catch (e) {
                console.log("استخدام البيانات المحلية كنموذج عرض");
            }
            renderTable(allResultsData.reverse());
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach(r => {
                const parts = r.score.split(' / ');
                const score = Number(parts[0]);
                const total = Number(parts[1]);
                const isPass = (score / total) >= 0.5;

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:bold;">${r.name}</td>
                        <td><span style="color:var(--cyan-bright); font-family:monospace; font-size:1.2rem;">${r.score}</span></td>
                        <td style="color:var(--purple-bright); font-size:0.9rem;">${r.date}</td>
                        <td>
                            <span class="badge ${isPass ? 'pass' : 'fail'}">
                                ${isPass ? '✔ ناجح' : '✖ راسب'}
                            </span>
                        </td>
                    </tr>`;
            });
        }

        function filterResults() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allResultsData.filter(r => r.name.toLowerCase().includes(query));
            
            renderTable(filtered);
            document.getElementById('noResult').style.display = filtered.length === 0 ? 'block' : 'none';
        }

        window.onload = fetchResults;
    </script>
</body>
</html>
