<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سجل نتائج الطلاب - إعدادية النهرين المهنية</title>
    <style>
        @import url('https://googleapis.com');
        :root { --bg-dark: #0a192f; --cyan-bright: #00f2ff; --purple-bright: #d8b4fe; --card-bg: rgba(23, 42, 69, 0.8); --border: #1e3a5f; --text-white: #e6f1ff; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-dark); color: var(--text-white); margin: 0; padding: 20px; background-image: radial-gradient(circle at top right, #112240 0%, #0a192f 100%); }
        .school-header { display: flex; justify-content: flex-start; padding: 15px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .school-name { color: var(--cyan-bright); font-weight: bold; font-size: 1.2rem; border-left: 4px solid var(--purple-bright); padding-left: 15px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; font-weight: 900; font-size: 2.2rem; background: linear-gradient(to left, var(--cyan-bright), var(--purple-bright)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 40px; }
        .controls { display: flex; gap: 20px; margin-bottom: 30px; align-items: center; }
        .search-box { flex: 1; position: relative; }
        .search-box input { width: 100%; padding: 15px 45px 15px 15px; background: var(--card-bg); border: 2px solid var(--border); border-radius: 12px; color: white; font-size: 16px; outline: none; box-sizing: border-box; }
        .search-box::after { content: '🔍'; position: absolute; right: 15px; top: 15px; font-size: 20px; }
        .btn-print { background: linear-gradient(45deg, #00d2ff, #3a7bd5); color: white; border: none; padding: 15px 30px; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .table-container { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { color: var(--purple-bright); padding: 20px; text-align: right; border-bottom: 2px solid var(--border); }
        td { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .badge { padding: 6px 15px; border-radius: 8px; font-size: 13px; font-weight: bold; }
        .pass { background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid #00ff88; }
        .fail { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid #ff4757; }
    </style>
</head>
<body>
    <div class="school-header"><div class="school-name">| إعدادية النهرين المهنية</div></div>
    <div class="container">
        <h1>📊 سجل نتائج الطلاب الرقمي</h1>
        <div class="controls">
            <div class="search-box"><input type="text" id="searchInput" onkeyup="filterResults()" placeholder="ابحث عن اسم الطالب..."></div>
            <button class="btn-print" onclick="window.print()">🖨️ طباعة التقرير</button>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>اسم الطالب</th><th>الدرجة</th><th>تاريخ التقديم</th><th>النتيجة</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div id="noResult" style="display:none; text-align:center; padding:40px; color:var(--purple-bright);">❌ لا توجد نتائج.</div>
        </div>
    </div>
    <script>
        let allResultsData = [];
        async function fetchResults() {
            const res = await fetch('/api/get-all-results');
            allResultsData = await res.json();
            renderTable(allResultsData);
        }
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(r => {
                const [score, total] = r.score.split(' / ').map(Number);
                const isPass = (score / total) >= 0.5;
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:bold;">${r.name}</td>
                        <td><span style="color:var(--cyan-bright); font-size:1.2rem;">${r.score}</span></td>
                        <td style="color:var(--purple-bright); font-size:0.9rem; direction:ltr; text-align:right;">${r.date || 'غير متوفر'}</td>
                        <td><span class="badge ${isPass ? 'pass' : 'fail'}">${isPass ? '✔ ناجح' : '✖ راسب'}</span></td>
                    </tr>`;
            });
        }
        function filterResults() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allResultsData.filter(r => r.name.toLowerCase().includes(query));
            renderTable(filtered);
            document.getElementById('noResult').style.display = filtered.length === 0 ? 'block' : 'none';
        }
        window.onload = fetchResults;
    </script>
</body>
</html>
